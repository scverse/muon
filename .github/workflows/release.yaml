name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+**"
  workflow_dispatch:

# Use "trusted publishing", see https://docs.pypi.org/trusted-publishers/
permissions: {}

jobs:
  release-pypi:
    name: Upload release to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/muon
    permissions:
      contents: read
      id-token: write # IMPORTANT: this permission is mandatory for trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: blob:none
          fetch-depth: 0
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - name: Build package
        run: uv build
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
  release-gh:
    name: Create GH release
    runs-on: ubuntu-slim
    permissions:
      contents: write
    steps:
      - name: create GH release
        env:
          ref_name: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          PRE=$(echo "$ref_name" | sed -E 's/^v[0-9]+\.[0-9]+\.[0-9]+(.+?)$/\1/' | wc -w)

          args=("-n")
          if [ $PRE  = 0 ] ; then
              args+=("https://muon.scverse.org/stable/changelog.html")
          else
              args+=("https://muon.scverse.org/latest/changelog.html" "-p")
          fi

          gh release create -R "$GITHUB_REPOSITORY"  "$ref_name" ${args[@]}
