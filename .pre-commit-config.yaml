fail_fast: false
default_language_version:
  python: python3
default_stages:
  - pre-commit
  - pre-push
minimum_pre_commit_version: 2.16.0
# Bundled JASPAR motif reference data, not source code.
exclude: ^src/muon/atac/_ref/jaspar/
repos:
  - repo: https://github.com/biomejs/pre-commit
    rev: 3a0c6458e3d46fb8d931600cd3970f2053768ce3  # frozen: v2.5.9
    hooks:
      - id: biome-format
        exclude: ^\.cruft\.json$ # inconsistent indentation with cruft - file never to be modified manually.
  - repo: https://github.com/tox-dev/pyproject-fmt
    rev: 67cd950188cc8e2611e9ac21d1b032fdd446c601  # frozen: v2.28.0
    hooks:
      - id: pyproject-fmt
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 65dbdb59d2f2d9c3bdc343c566821ad3319ddaa3  # frozen: v0.16.3
    hooks:
      - id: ruff-check
        types_or: [python, pyi, jupyter]
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
        types_or: [python, pyi, jupyter]
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run --group test mypy src tests
        language: system
        types: [python]
        files: ^(src|tests)/
        require_serial: true
        pass_filenames: false
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: detect-private-key
      - id: check-ast
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: trailing-whitespace
      - id: check-case-conflict
      # Check that there are no merge conflicts (could be generated by template sync)
      - id: check-merge-conflict
        args: [--assume-in-merge]

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: 451b56af716f9f0d0c2b816503a3fd0cf8b036fa  # frozen: v1.29.0
    hooks:
      - id: zizmor
        args: [--no-progress, --fix]
